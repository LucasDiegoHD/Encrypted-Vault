name: CI & SAST Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-security:
    name: Build, Pytest & Bandit SAST
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Style Verification (Black & Flake8)
        run: |
          black --check vault/ tests/
          flake8 vault/ tests/ --max-line-length=120

      - name: Security Analysis (Bandit SAST)
        run: |
          bandit -r vault/ -ll

      - name: Unit Tests & Coverage
        run: |
          pytest --cov=vault --cov-report=term-missing tests/
